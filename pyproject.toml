[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-audit"
version = "2.0.0"
description = "Excel 理赔台账对账与审计工具：Decimal 重算、差异定位、四表报告、退出码"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

authors = [
    {name = "oiopuppy"},
]

keywords = [
    "insurance", "audit", "excel", "automation",
    "理赔审计", "自动化对账",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Insurance",
]

dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "hypothesis>=6.92.0",
]

[project.scripts]
insurance-audit = "insurance_audit.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["insurance_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-config",
    "--strict-markers",
    "-p no:cacheprovider",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests across components",
    "slow: Tests that take longer to run",
    "smoke: Quick smoke tests for CI pipeline",
]

[tool.mypy]
# mypy 1.20 起不再支持把 3.9 作为分析目标（must be 3.10 or higher），
# 这里按 3.10 语义做类型检查；3.9 的运行时兼容性由 CI 的 3.9 测试矩阵保证。
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.ruff]
# requires-python 是 >=3.9，规则集合必须按 3.9 判断可用的语法，
# 否则会强制把 Optional[X] 改写成 3.10+ 才支持的 X | None。
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit security
    "B",   # bugbear
    "SIM", # simplify
    "ARG", # unused arguments
]
ignore = ["E501"]  # 行长由 formatter 负责

[tool.ruff.lint.per-file-ignores]
# 测试里 assert 是 pytest 的断言方式，不是安全风险
"tests/**" = ["S101"]
# 异常类名沿用 v1 的公开 API（DataException 等），改名会破坏调用方导入
"src/insurance_audit/utils/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["insurance_audit"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
