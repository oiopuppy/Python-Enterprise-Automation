name: Release & SBOM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # 手动跑只生成 SBOM artifact，不创建 release

permissions:
  contents: write

jobs:
  sbom:
    name: 🧾 生成 CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 设置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: 安装运行时依赖与 SBOM 工具
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cyclonedx-bom

      - name: 生成 SBOM（从实际安装环境读取版本）
        run: cyclonedx-py environment -o sbom.cdx.json

      - name: 校验 SBOM 可解析
        run: |
          python - <<'PY'
          import json
          with open("sbom.cdx.json", encoding="utf-8") as fh:
              data = json.load(fh)
          assert data["bomFormat"] == "CycloneDX", data.get("bomFormat")
          assert data["components"], "SBOM 里没有组件"
          print(f"SBOM OK: spec={data['specVersion']} components={len(data['components'])}")
          PY

      - name: 上传 SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: 附加到 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" sbom.cdx.json --clobber
