name: CI Pipeline — 保险理赔审计系统

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: 🔍 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 文档与元数据检查
        run: |
          python scripts/check_markdown_links.py
          python scripts/check_env_example.py
          python scripts/check_version_consistency.py

      - name: Ruff 代码检查
        run: ruff check src/ tests/ scripts/

      - name: Ruff 格式检查
        run: ruff format --check src/ tests/ scripts/

      - name: MyPy 类型检查
        run: mypy --strict src/ --ignore-missing-imports

  test:
    name: 🧪 测试 (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试与覆盖率
        run: |
          pytest tests/ -v \
            --cov=insurance_audit \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=test-results.xml

      - name: 上传测试结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

  security:
    name: 🛡️ 安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 设置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装安全工具
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: 依赖漏洞扫描（pip-audit）
        run: pip-audit -r requirements.txt --strict --progress-spinner off

      - name: Bandit 安全扫描（中危及以上）
        run: bandit -r src/ -ll -f json -o bandit-report.json

      - name: 上传安全报告
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  build:
    name: 📦 构建验证
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 设置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 构建包
        run: |
          pip install build
          python -m build

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
