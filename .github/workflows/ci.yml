name: CI Pipeline — 保险理赔审计系统

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: 🔍 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff 代码风格检查
        run: ruff check src/

      - name: Ruff 格式检查
        run: ruff format --check src/

      - name: MyPy 类型检查
        run: mypy --strict src/ --ignore-missing-imports

  test:
    name: 🧪 测试套件
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: 运行单元测试
        run: |
          pytest tests/ -v -m "unit" --junitxml=test-results-unit.xml

      - name: 运行集成测试
        run: |
          pytest tests/ -v -m "integration" --junitxml=test-results-integration.xml

      - name: 覆盖率报告
        run: |
          pytest tests/ --cov=insurance_audit --cov-report=xml --cov-report=term-missing

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results-*.xml
            coverage.xml

  security:
    name: 🛡️ 安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 bandit
        run: pip install bandit

      - name: Bandit 安全扫描
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: 上传安全报告
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  build:
    name: 📦 构建验证
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 构建包
        run: |
          pip install build
          python -m build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
