name: 功能需求
description: 希望增加或调整的能力
labels: ["enhancement", "status: triage"]
assignees: ["oiopuppy"]
body:
  - type: markdown
    attributes:
      value: |
        先看 `docs/01-产品与范围.md` 的「非目标」——Web 界面、数据库、权限体系、跨表对账都不在范围内。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述场景和当前的不便，不要直接跳到方案
      placeholder: 每个月要审 20 个机构的文件，现在只能一个一个跑，想批量处理并汇总
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的用法
      description: 命令行怎么调、输入输出长什么样；不确定可以不填
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在是怎么绕过这个问题的
    validations:
      required: false
  - type: dropdown
    id: impact
    attributes:
      label: 影响范围
      options:
        - 只是更顺手
        - 明显节省时间
        - 影响结论正确性
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我确认这不在 `docs/01-产品与范围.md` 的非目标里
          required: true
